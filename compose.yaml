services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gymdesk
      POSTGRES_PASSWORD: gymdesk
      POSTGRES_DB: gymdesk
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymdesk -d gymdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
